function createTable(dataArray) {
            const table = document.createElement("table");
            const headerRow = table.insertRow();

            // Extract headers from the first object in the filtered data
            const headers = Object.keys(dataArray[0]);

            // Create the column number header
            const colNumHeader = document.createElement("th");
            colNumHeader.textContent = "#";
            headerRow.appendChild(colNumHeader);

            // Create table headers
            headers.forEach(header => {
                const th = document.createElement("th");
                th.textContent = header;
                headerRow.appendChild(th);
            });

            // Create table rows and cells with data
            dataArray.forEach((obj, index) => {
                const row = table.insertRow();
                const colNumCell = row.insertCell();
                colNumCell.textContent = index + 1;

                headers.forEach(header => {
                    const cell = row.insertCell();
                    cell.textContent = obj[header];
                });
            });

            return table;
        }
